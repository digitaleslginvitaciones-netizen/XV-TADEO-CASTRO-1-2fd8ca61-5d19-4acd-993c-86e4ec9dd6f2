<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>XV Tadeo — Pase para 1</title>
    <meta name="theme-color" content="#000000">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            background: #000;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .cover {
            position: relative;
            width: min(100vw, 480px);
            line-height: 0;
        }

        .cover img {
            display: block;
            width: 100%;
            height: auto;
        }

        .open {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: block;
            cursor: pointer;
        }

        .open:focus-visible {
            outline: 3px solid white;
            outline-offset: -3px;
        }
    </style>
</head>

<body>
    <main class="cover">
        <img
            src="portada.png"
            alt="Portada de invitación XV Tadeo. Pase reservado para 1 persona"
        >

        <a
            class="open"
            href="https://invitaciones-digitales-lg.my.canva.site/copia-de-copia-de-brissa-y-antonio-definitivo"
            aria-label="Abrir invitación completa de XV Tadeo"
            title="Abrir invitación completa"
        ></a>
    </main>
</body>
